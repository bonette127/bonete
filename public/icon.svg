<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Code Bracket Left -->
  <path d="M 120 200 L 70 256 L 120 312" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Code Bracket Right -->
  <path d="M 392 200 L 442 256 L 392 312" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Central Stylized 'B' Monogram -->
  <g filter="url(#shadow)">
    <!-- Main Stem of B -->
    <path d="M 180 140 L 290 140 C 340 140 370 165 370 205 C 370 235 350 255 320 262 C 360 270 385 295 385 335 C 385 380 345 408 290 408 L 180 408 Z" fill="#ffffff" />
    
    <!-- Cutouts for B -->
    <path d="M 230 185 L 285 185 C 315 185 328 195 328 212 C 328 229 315 240 285 240 L 230 240 Z" fill="#047857" />
    <path d="M 230 285 L 292 285 C 325 285 342 298 342 320 C 342 342 325 355 292 355 L 230 355 Z" fill="#047857" />
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="rgba(255, 255, 255, 0.9)" text-anchor="middle">
    L5 SOD · RWANDA
  </text>
</svg>
